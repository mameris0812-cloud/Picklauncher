name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q PickLauncher.zip

      - name: Fix compile error
        run: sed -i 's/2 \* 56\.dp + 6\.dp/118.dp/' PickLauncher/app/src/main/java/com/example/picklauncher/MainActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: PickLauncher
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PickLauncher-apk
          path: PickLauncher/app/build/outputs/apk/debug/app-debug.apk
